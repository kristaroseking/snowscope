<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowscope - Skiing Condition Rating</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .scenario-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn-scenario {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-scenario.average {
            background: #4CAF50;
            color: white;
        }
        
        .btn-scenario.excellent {
            background: #2196F3;
            color: white;
        }
        
        .btn-scenario.poor {
            background: #f44336;
            color: white;
        }
        
        .btn-scenario.blower {
            background: #ff69b4;
            color: white;
        }
        
        .btn-scenario:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-calculate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .results {
            display: none;
            margin-top: 30px;
        }
        
        .results.show {
            display: block;
        }
        
        .rating-card {
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .rating-card h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: white;
        }
        
        .snow-icon {
            font-size: 3em;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .rating-value {
            font-size: 4em;
            font-weight: bold;
            margin: 20px 0;
            color: white;
        }
        
        .total-points {
            font-size: 2em;
            opacity: 0.95;
            color: white;
        }
        
        .time-bar {
            display: flex;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            height: 40px;
        }
        
        .time-segment {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .time-segment.morning {
            background: linear-gradient(135deg, #ffd700 0%, #ffa500 100%);
        }
        
        .time-segment.noon {
            background: linear-gradient(135deg, #87ceeb 0%, #4682b4 100%);
        }
        
        .time-segment.night {
            background: linear-gradient(135deg, #191970 0%, #000080 100%);
        }
        
        .calculation-breakdown {
            background: #f5f5f5;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .calculation-breakdown h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .factor-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .factor-name {
            font-weight: 600;
            color: #333;
        }
        
        .factor-details {
            text-align: right;
            color: #666;
        }
        
        .forecast-section {
            margin-top: 40px;
        }
        
        .forecast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .forecast-header h2 {
            color: #333;
        }
        
        .forecast-slider {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
        }
        
        .forecast-track {
            display: flex;
            gap: 20px;
            transition: transform 0.3s ease;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .day-card {
            min-width: 280px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid;
        }
        
        .day-card .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .day-card .day-name {
            font-weight: bold;
            color: #333;
        }
        
        .day-card .day-date {
            color: #666;
            font-size: 0.9em;
        }
        
        .day-card .rating-badge {
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .day-card .day-stats {
            margin-top: 15px;
            font-size: 0.9em;
        }
        
        .day-card .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #666;
        }
        
        .day-card .points-display {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }
        
        .slider-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .slider-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .slider-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .slider-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .weight-adjustment {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .weight-adjustment h4 {
            color: #856404;
            margin-bottom: 10px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎿 Snowscope</h1>
            <p>Skiing Condition Rating System</p>
        </div>
        
        <div class="content">
            <div class="scenario-buttons">
                <button class="btn-scenario average" onclick="loadScenario('average')">
                    📊 Average Winter Conditions
                </button>
                <button class="btn-scenario excellent" onclick="loadScenario('excellent')">
                    ⭐ Excellent Powder Day
                </button>
                <button class="btn-scenario poor" onclick="loadScenario('poor')">
                    ⚠️ Poor Conditions
                </button>
                <button class="btn-scenario blower" onclick="loadScenario('blower')">
                    🌨️ BLOWER Conditions
                </button>
            </div>
            
            <form id="ratingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Temperature (°F)</label>
                        <input type="number" id="temperature" name="temperature" value="25" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>Wind Speed (mph)</label>
                        <input type="number" id="wind_speed" name="wind_speed" value="8" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>Base Depth (inches)</label>
                        <input type="number" id="base_depth" name="base_depth" value="35" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>New Snow 24h (inches)</label>
                        <input type="number" id="new_snow_24h" name="new_snow_24h" value="6" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>Snow Quality</label>
                        <select id="snow_quality" name="snow_quality">
                            <option value="blower powder">Blower/Champagne Powder (100 pts)</option>
                            <option value="regular density snow" selected>Regular Density Snow (75 pts)</option>
                            <option value="wet heavy snow">Wet Heavy Snow (25 pts)</option>
                            <option value="icy">Icy (0 pts)</option>
                            <option value="rain">Rain (0 pts)</option>
                            <option value="sleet">Sleet (0 pts)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Precipitation Type</label>
                        <select id="precipitation_type" name="precipitation_type">
                            <option value="">None</option>
                            <option value="snow">Snow</option>
                            <option value="rain">Rain</option>
                            <option value="sleet">Sleet</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Humidity (%)</label>
                        <input type="number" id="humidity" name="humidity" value="65" min="0" max="100">
                    </div>
                    
                    <div class="form-group">
                        <label>Visibility (km)</label>
                        <input type="number" id="visibility" name="visibility" value="10" step="0.1">
                    </div>
                </div>
                
                <button type="submit" class="btn-calculate">Calculate Rating</button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Calculating rating...</p>
            </div>
            
            <div class="error" id="error"></div>
            
            <div class="results" id="results">
                <div class="rating-card" id="ratingCard">
                    <div class="snow-icon">❄️</div>
                    <h2>Overall Rating</h2>
                    <div class="rating-value" id="ratingValue">-</div>
                    <div class="total-points" id="totalPoints">0 / 100 points</div>
                    
                    <div class="time-bar">
                        <div class="time-segment morning">Morning<br>(12am-8am)</div>
                        <div class="time-segment noon">Noon<br>(8am-4pm)</div>
                        <div class="time-segment night">Night<br>(4pm-12am)</div>
                    </div>
                </div>
                
                <div class="calculation-breakdown">
                    <h3>Calculation Breakdown</h3>
                    <div id="breakdown"></div>
                </div>
                
                <div class="calculation-breakdown">
                    <h3>Weights Applied</h3>
                    <div id="weights"></div>
                </div>
                
                <div id="weightAdjustment"></div>
                
                <div class="forecast-section">
                    <div class="forecast-header">
                        <h2>10-Day Forecast</h2>
                        <span id="forecastStatus">Loading...</span>
                    </div>
                    
                    <div class="forecast-slider">
                        <div class="forecast-track" id="forecastTrack"></div>
                    </div>
                    
                    <div class="slider-controls">
                        <button class="slider-btn" id="prevBtn" onclick="slideForecast(-1)">← Previous</button>
                        <span id="sliderInfo">Day 1-3 of 10</span>
                        <button class="slider-btn" id="nextBtn" onclick="slideForecast(1)">Next →</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentSlide = 0;
        let forecastData = [];
        const cardsPerView = 3;
        
        const ratingColors = {
            'BAD': '#dc3545',
            'POOR': '#ff8c00',
            'FAIR': '#90ee90',
            'GOOD': '#28a745',
            'EXCELLENT': '#006400',
            'PERFECT': '#9370db',
            'BLOWER': '#ff69b4'
        };
        
        async function loadScenario(scenario) {
            try {
                const response = await fetch(`/api/dummy-data/${scenario}`);
                const data = await response.json();
                
                document.getElementById('temperature').value = data.temperature;
                document.getElementById('wind_speed').value = data.wind_speed;
                document.getElementById('base_depth').value = data.base_depth;
                document.getElementById('new_snow_24h').value = data.new_snow_24h;
                document.getElementById('snow_quality').value = data.snow_quality;
                document.getElementById('precipitation_type').value = data.precipitation_type || '';
                document.getElementById('humidity').value = data.humidity;
                document.getElementById('visibility').value = data.visibility;
                
                document.getElementById('ratingForm').dispatchEvent(new Event('submit'));
            } catch (error) {
                showError('Failed to load scenario: ' + error.message);
            }
        }
        
        document.getElementById('ratingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            
            loading.classList.add('show');
            results.classList.remove('show');
            error.classList.remove('show');
            
            try {
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                
                Object.keys(data).forEach(key => {
                    if (data[key] && !isNaN(data[key])) {
                        data[key] = parseFloat(data[key]);
                    }
                });
                
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Calculation failed');
                }
                
                const result = await response.json();
                displayResults(result);
                
                // Load forecast
                await loadForecast();
                
            } catch (err) {
                showError(err.message);
            } finally {
                loading.classList.remove('show');
            }
        });
        
        function displayResults(result) {
            const rating = result.rating;
            const color = result.rating_color;
            const points = result.total_weighted_points;
            
            // Update rating card
            const ratingCard = document.getElementById('ratingCard');
            ratingCard.style.background = `linear-gradient(135deg, ${color} 0%, ${adjustBrightness(color, -20)} 100%)`;
            
            document.getElementById('ratingValue').textContent = rating;
            document.getElementById('totalPoints').textContent = `${points} / 100 points`;
            
            // Display calculation breakdown
            const breakdown = document.getElementById('breakdown');
            breakdown.innerHTML = '';
            
            const factors = ['new_snow', 'base_depth', 'quality', 'temperature', 'wind'];
            factors.forEach(factor => {
                const row = document.createElement('div');
                row.className = 'factor-row';
                
                const rawPoints = result.factor_points[factor];
                const weight = result.details.weights_used[factor];
                const contribution = result.weighted_factor_points[factor];
                
                row.innerHTML = `
                    <div>
                        <span class="factor-name">${formatFactorName(factor)}</span>
                    </div>
                    <div class="factor-details">
                        ${rawPoints} pts × ${weight}% = <strong>${contribution} pts</strong>
                    </div>
                `;
                
                breakdown.appendChild(row);
            });
            
            // Display weights
            const weightsDiv = document.getElementById('weights');
            weightsDiv.innerHTML = '';
            
            factors.forEach(factor => {
                const row = document.createElement('div');
                row.className = 'factor-row';
                
                const baseWeight = result.details.base_weights[factor] || result.details.weights_used[factor];
                const adjWeight = result.details.weights_used[factor];
                const isAdjusted = Math.abs(baseWeight - adjWeight) > 0.1;
                
                row.innerHTML = `
                    <div>
                        <span class="factor-name">${formatFactorName(factor)}</span>
                    </div>
                    <div class="factor-details">
                        ${isAdjusted ? `${baseWeight}% → ${adjWeight}% (adjusted)` : `${adjWeight}% (base)`}
                    </div>
                `;
                
                weightsDiv.appendChild(row);
            });
            
            // Display weight adjustment if applied
            const adjustmentDiv = document.getElementById('weightAdjustment');
            if (result.details.weight_adjustment_applied) {
                adjustmentDiv.innerHTML = `
                    <div class="weight-adjustment">
                        <h4>🎿 Dynamic Weight Adjustment (>12in snow bonus)</h4>
                        <p><strong>New snow amount:</strong> ${result.details.new_snow_inches} inches</p>
                        <p><strong>Weight increase:</strong> +${result.details.weight_increase}%</p>
                        <p><strong>New snow weight:</strong> ${result.details.weights_used.new_snow}%</p>
                    </div>
                `;
            } else {
                adjustmentDiv.innerHTML = '';
            }
            
            document.getElementById('results').classList.add('show');
        }
        
        async function loadForecast() {
            try {
                const response = await fetch('/api/forecast/10');
                forecastData = await response.json();
                renderForecast();
            } catch (error) {
                document.getElementById('forecastStatus').textContent = 'Failed to load forecast';
            }
        }
        
        function renderForecast() {
            const track = document.getElementById('forecastTrack');
            track.innerHTML = '';
            
            forecastData.forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';
                card.style.borderTopColor = day.rating_color;
                
                card.innerHTML = `
                    <div class="day-header">
                        <div>
                            <div class="day-name">${day.day_name}</div>
                            <div class="day-date">${day.date}</div>
                        </div>
                        <div class="rating-badge" style="background: ${day.rating_color}">
                            ${day.rating}
                        </div>
                    </div>
                    <div class="points-display" style="color: ${day.rating_color}">
                        ${day.points}
                    </div>
                    <div class="day-stats">
                        <div class="stat-row">
                            <span>🌡️ Temp:</span>
                            <span>${day.temperature}°F</span>
                        </div>
                        <div class="stat-row">
                            <span>💨 Wind:</span>
                            <span>${day.wind_speed} mph</span>
                        </div>
                        <div class="stat-row">
                            <span>❄️ New Snow:</span>
                            <span>${day.new_snow}"</span>
                        </div>
                        <div class="stat-row">
                            <span>📏 Base:</span>
                            <span>${day.base_depth}"</span>
                        </div>
                        <div class="stat-row">
                            <span>🎿 Quality:</span>
                            <span>${day.snow_quality}</span>
                        </div>
                    </div>
                `;
                
                track.appendChild(card);
            });
            
            updateSlider();
            document.getElementById('forecastStatus').textContent = `${forecastData.length} days loaded`;
        }
        
        function slideForecast(direction) {
            const maxSlide = Math.max(0, forecastData.length - cardsPerView);
            currentSlide = Math.max(0, Math.min(maxSlide, currentSlide + direction * cardsPerView));
            updateSlider();
        }
        
        function updateSlider() {
            const track = document.getElementById('forecastTrack');
            const offset = -currentSlide * (280 + 20); // card width + gap
            track.style.transform = `translateX(${offset}px)`;
            
            const start = currentSlide + 1;
            const end = Math.min(currentSlide + cardsPerView, forecastData.length);
            document.getElementById('sliderInfo').textContent = `Day ${start}-${end} of ${forecastData.length}`;
            
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide >= forecastData.length - cardsPerView;
        }
        
        function formatFactorName(factor) {
            return factor.split('_').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }
        
        function adjustBrightness(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
        
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.classList.add('show');
        }
        
        // Load blower conditions on page load
        window.addEventListener('load', () => {
            loadScenario('blower');
        });
    </script>
</body>
</html>
